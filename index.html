  <script>
  /* Tema: pilihan eksplisit (localStorage 'theme') selalu menang; kalau
   * belum ada, pakai hasil acak sesi ini (sessionStorage); kalau belum
   * ada juga, undi dari pool 6 tema dan simpan di sessionStorage saja —
   * bukan localStorage, karena undian bukan pilihan. Jalan sebelum paint
   * supaya tidak kedip. Migrasi: 'light' lama → game, 'dark' lama → terminal. */
  (function(){try{
    var POOL=['game','terminal','retro','neon','space','solarized'];
    var COLORS={game:'#232a4d',terminal:'#0a0f0a',retro:'#1a1836',neon:'#050508',space:'#030712',solarized:'#002b36'};
    var t=null;try{t=localStorage.getItem('theme')}catch(e){}
    if(t==='light')t='game';
    if(t==='dark')t='terminal';
    if(t&&POOL.indexOf(t)<0)t=null;
    if(!t){try{t=sessionStorage.getItem('theme-session')}catch(e){}}
    if(!t||POOL.indexOf(t)<0){t=POOL[Math.floor(Math.random()*POOL.length)];try{sessionStorage.setItem('theme-session',t)}catch(e){}}
    var r=document.documentElement;
    r.setAttribute('data-theme',t);
    if(t!=='game')r.classList.add('dark');
    try{if(localStorage.getItem('mode')==='pro')r.classList.add('pro')}catch(e){}
    var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',COLORS[t]||'#232a4d');
  }catch(e){}})();
  </script>
